<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Партитура · программа на 3 года</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Onest:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#131419; --panel:#1B1D24; --panel2:#212430; --line:#2C303C;
  --text:#E9E6DF; --dim:#8B8D99; --dimmer:#5E606C;
  --gold:#C9A961; --sage:#7D9E7A; --blue:#6E8FB8; --rose:#B2757A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0} 
body{background:var(--ink);color:var(--text);font-family:'Onest',system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:26px 18px 104px}

header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dimmer)}
h1{font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(25px,5vw,40px);
  margin:9px 0 6px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;max-width:64ch}

/* ---- уровень и баллы ---- */
.lvl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.lvlname{font-family:'Unbounded',sans-serif;font-weight:500;font-size:17px;color:var(--gold)}
.lvlpts{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.lvlbar{flex:1;min-width:170px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--gold);width:0;transition:.4s}
.lvlnext{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dimmer)}

.score{display:flex;gap:3px;margin-top:16px;height:24px;align-items:flex-end}
.score i{flex:1;background:var(--panel2);border-radius:1px;height:7px;transition:.35s;display:block}
.score i.on{background:var(--gold);height:24px}
.score i.part{background:var(--dimmer);height:15px}
.scorelab{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:var(--dimmer);margin-top:6px;letter-spacing:.08em}

.today{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:3px;padding:19px 21px;margin:24px 0 28px}
.today .cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.today h2{font-family:'Unbounded',sans-serif;font-weight:500;font-size:20px;margin:8px 0 2px}
.today .meta{color:var(--dim);font-size:13px;margin-bottom:13px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);
  padding-bottom:13px}
.tab{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.07em;
  padding:8px 13px;border-radius:2px;transition:.2s}
.tab:hover{color:var(--text);border-color:var(--dimmer)}
.tab[aria-selected="true"]{background:var(--gold);color:#15161B;border-color:var(--gold);font-weight:500}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.month{border:1px solid var(--line);border-radius:3px;margin-bottom:11px;background:var(--panel)}
.month.exam{border-color:rgba(201,169,97,.45)}
.mhead{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer;width:100%;
  background:none;border:0;color:inherit;text-align:left;font-family:inherit}
.mhead:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.mnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dimmer);
  border:1px solid var(--line);padding:3px 7px;border-radius:2px;flex:none}
.mtitle{flex:1;min-width:0}
.mtitle b{font-family:'Unbounded',sans-serif;font-weight:500;font-size:15px;display:block;
  letter-spacing:-.01em}
.mtitle span{color:var(--dim);font-size:12.5px;display:block;margin-top:3px}
.mpct{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);flex:none}
.chev{color:var(--dimmer);flex:none;transition:.25s;font-size:12px}
.month.open .chev{transform:rotate(90deg)}
.mbody{display:none;padding:0 17px 17px}
.month.open .mbody{display:block}

.mprod{background:var(--panel2);border-left:2px solid var(--sage);padding:11px 14px;
  border-radius:2px;margin-bottom:15px;font-size:13.5px}
.mprod b{color:var(--sage);font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:4px}
.mbooks{font-size:12.5px;color:var(--dim);margin-bottom:15px;line-height:1.55}
.mbooks b{color:var(--text);font-weight:500}

.dt{border:1px solid var(--line);border-radius:2px;margin:0 0 11px;background:var(--panel2)}
.dt>summary{cursor:pointer;list-style:none;padding:10px 13px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.dt>summary::-webkit-details-marker{display:none}
.dt>summary::before{content:"▶ ";font-size:9px;display:inline-block;transition:.2s}
.dt[open]>summary::before{transform:rotate(90deg)}
.dt>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dtb{padding:2px 15px 14px}
.dts{margin-bottom:13px}
.dts:last-child{margin-bottom:0}
.dts b{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.dts p{margin:0 0 6px;color:var(--dim);font-size:13px;line-height:1.5}
.dts ul{margin:0;padding-left:17px;color:var(--dim);font-size:13px;columns:2;column-gap:26px}
.dts li{margin-bottom:2px;break-inside:avoid}
@media(max-width:620px){.dts ul{columns:1}}
.week{margin-bottom:17px}
.whead{display:flex;align-items:baseline;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);
  margin-bottom:9px;flex-wrap:wrap}
.wnum{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  color:var(--dimmer);text-transform:uppercase}
.wtheme{font-weight:600;font-size:14px}
.wmode{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 6px;border-radius:2px;
  letter-spacing:.1em}
.wmode.b{background:rgba(201,169,97,.14);color:var(--gold)}
.wmode.o{background:rgba(178,117,122,.16);color:var(--rose)}
.wres{width:100%;font-size:12.5px;color:var(--dim);margin-top:2px}
.wres b{color:var(--sage);font-weight:500}

.day{display:grid;grid-template-columns:74px 1fr;gap:13px;padding:10px 0;
  border-bottom:1px dashed rgba(44,48,60,.75)}
.day:last-child{border-bottom:0}
.day.now{background:rgba(201,169,97,.06);border-radius:2px;box-shadow:inset 3px 0 0 var(--gold);
  padding-left:11px;margin-left:-11px}
.dstamp{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dimmer);
  line-height:1.45;padding-top:2px}
.dstamp b{display:block;color:var(--text);font-size:12px;font-weight:500;letter-spacing:.05em}
.items{display:flex;flex-direction:column;gap:7px;min-width:0}
.itw{min-width:0}
.hw{margin:3px 0 0 29px}
.hw>summary{cursor:pointer;list-style:none;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);padding:2px 0}
.hw>summary::-webkit-details-marker{display:none}
.hw>summary::before{content:"+ ";font-size:11px}
.hw[open]>summary::before{content:"– "}
.hw>summary:hover{color:var(--gold)}
.hw>summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hwb{border-left:2px solid var(--line);padding:8px 0 6px 13px;margin-top:4px}
.hwb>b{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
.hwl{margin-bottom:9px}
.hwl>span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.hwl ol,.hwl ul{margin:0;padding-left:17px;color:var(--dim);font-size:12.5px;line-height:1.45}
.hwl li{margin-bottom:3px}
.hwd{font-size:12.5px;color:var(--sage);border-top:1px solid var(--line);padding-top:6px;line-height:1.45}

label.it{display:grid;grid-template-columns:19px 1fr;gap:10px;cursor:pointer;align-items:start}
label.it input{appearance:none;-webkit-appearance:none;width:17px;height:17px;margin:2px 0 0;
  border:1.5px solid var(--dimmer);border-radius:2px;background:none;cursor:pointer;
  flex:none;transition:.18s;position:relative}
label.it input:hover{border-color:var(--gold)}
label.it input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
label.it input:checked{background:var(--sage);border-color:var(--sage)}
label.it input:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #131419;border-width:0 2px 2px 0;transform:rotate(42deg)}
.itxt{font-size:13.5px;line-height:1.42;min-width:0}
.itxt em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);display:inline-block;
  margin-right:7px;vertical-align:1px}
.itxt em.media{color:var(--blue)}
.itxt em.prod{color:var(--gold)}
.itxt em.field{color:var(--sage)}
.itxt i.pts{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--dimmer);margin-left:6px}
.itw{display:flex;flex-direction:column;gap:3px}
details.how{margin:1px 0 0 29px}
details.how>summary{cursor:pointer;list-style:none;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);
  padding:1px 0;transition:.15s}
details.how>summary:hover{color:var(--gold)}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::before{content:"+ ";font-size:10px}
details.how[open]>summary::before{content:"– "}
details.how>summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.howb{border-left:1px solid var(--line);padding:6px 0 4px 12px;margin-top:4px}
.howb b{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.howb b+ol,.howb b+ul{margin:0 0 10px}
.howb ol,.howb ul{padding-left:18px;color:var(--dim);font-size:12.5px;line-height:1.45}
.howb li{margin-bottom:3px}
.howb ul{list-style:none;padding-left:2px}
.howb ul li::before{content:"— ";color:var(--dimmer)}
.itxt small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.4}
label.it input:checked ~ .itxt{color:var(--dimmer);text-decoration:line-through;
  text-decoration-color:rgba(139,141,153,.4)}
label.it input:checked ~ .itxt small,label.it input:checked ~ .itxt em,
label.it input:checked ~ .itxt i.pts{color:var(--dimmer);text-decoration:none}

/* справочник */
.ref h3{font-family:'Unbounded',sans-serif;font-weight:500;font-size:16px;margin:26px 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.ref h4{font-size:13px;color:var(--gold);margin:16px 0 6px;font-weight:600;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.ref ul{margin:0 0 8px;padding-left:19px;color:var(--dim);font-size:13.5px}
.ref li{margin-bottom:3px}
.ref p{color:var(--dim);font-size:13.5px;margin:6px 0}

.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(19,20,25,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px;
  display:flex;align-items:center;gap:14px;justify-content:center;font-size:12.5px;
  font-family:'IBM Plex Mono',monospace;color:var(--dim);z-index:20;flex-wrap:wrap}
.bar b{color:var(--gold)}
.bar button{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  font-family:inherit;font-size:11px;padding:5px 10px;border-radius:2px}
.bar button:hover{color:var(--rose);border-color:var(--rose)}
.note{color:var(--dimmer);font-size:12.5px;margin-top:22px;line-height:1.6;max-width:76ch}
.note b{color:var(--text)}
.saving{color:var(--dimmer);font-size:11px;min-width:74px}
@media(max-width:620px){
  .day{grid-template-columns:1fr;gap:5px}
  .dstamp{display:flex;gap:8px;align-items:baseline}
  .dstamp b{display:inline}
  .wrap{padding:18px 13px 108px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">12 августа 2026 — 31 августа 2029</div>
  <h1>Партитура</h1>
  <div class="sub">Программа развития до уровня креативного директора в индустрии впечатлений. Каждый день расписан целиком: тема, книга с главами, фильм, задание. Отмечай — прогресс и баллы сохраняются.</div>

  <div class="lvl">
    <span class="lvlname" id="lvlname">—</span>
    <span class="lvlbar"><i id="lvlbar"></i></span>
    <span class="lvlpts" id="lvlpts">0 баллов</span>
    <span class="lvlnext" id="lvlnext"></span>
  </div>

  <div class="score" id="score"></div>
  <div class="scorelab"><span>МЕСЯЦ 1</span><span>ГОД 2</span><span>ГОД 3</span></div>
</header>

<div class="today" id="today"><div class="cap">Загрузка</div></div>

<div class="tabs" id="tabs" role="tablist"></div>
<div id="stage"></div>

<div class="note" id="legend"></div>
</div>

<div class="bar">
  <span>Выполнено <b id="donecount">0</b> из <b id="allcount">0</b></span>
  <span>Баллы <b id="ptscount">0</b></span>
  <span id="savestate" class="saving"></span>
  <button id="reset">Сбросить</button>
</div>

pts · Arc’teryx × Moment Factory · Burberry Open Spaces</li></ul>\n\n<h4>Семь методов превращения просмотра в насмотренность</h4>\n<ul><li>1. Разбор по пяти перспективам: стратег, режиссёр, арт-директор, продюсер, маркетолог</li><li>2. Сравнительные пары: два объекта с одной задачей и разным решением</li><li>3. Ограниченный мудборд: 9 изображений, каждое отвечает за один параметр</li><li>4. Антиреференсы: что делать нельзя и почему</li><li>5. Атлас принципов вместо коллекции картинок</li><li>6. Партитура опыта: девять точек проживания события</li><li>7. Визуальный экзамен: 10 незнакомых изображений на определение источника</li></ul>\n\n<h4>Рабочие шаблоны</h4>\n<p><b>Карточка кейса, 12 полей:</b> контекст · задача · аудитория · инсайт · идея · механика · визуальный язык · каналы · производство · результат · слабое место · адаптация.</p>\n<p><b>Быстрый лог, 3 поля:</b> задача · приём · почему сработало.</p>\n<p><b>Trend report:</b> сигнал · уровень (макро, поведенческий, категорийный, эстетический) · источник · срок жизни · кто уже использует · где станет клише · применение к своей категории · риск · пример · вывод.</p>\n<p><b>Семь критериев сильной идеи:</b> решает задачу · связана с инсайтом · понятна в одном предложении · развивается в разных каналах · не зависит от одного визуального приёма · даёт материал для пространства, сценария и контента · сохраняет смысл при сокращении бюджета.</p>\n<p><b>Партитура опыта:</b> что до входа · как понял правила · первый сигнал · где возникло любопытство · где упала энергия · кульминация · переход · финал · что осталось после.</p>\n<p><b>Структура защиты, 16 блоков:</b> контекст · задача · аудитория · культурное наблюдение · инсайт · направление · большая идея · драматургия · визуальная система · ключевые зоны · интерактивы · интеграции · производственный принцип · бюджетные сценарии · метрики · следующий шаг.</p>\n<p><b>Портфолио-кейс, 14 полей:</b> задача · контекст · моя роль · ограничения · исследование · инсайт · идея · в const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DAY=86400000;
const CW1=Date.UTC(2026,7,12);   // среда 12 августа 2026 — старт
const CW2=Date.UTC(2026,7,17);   // понедельник 17 августа
const cwStart=n=>n===1?CW1:CW2+(n-2)*7*DAY;
const cwEnd=n=>n===1?Date.UTC(2026,7,16):cwStart(n)+6*DAY;
const iso=t=>new Date(t).toISOString().slice(0,10);
const fmt=t=>{const d=new Date(t);return d.getUTCDate()+" "+MG[d.getUTCMonth()]};

/* сессии: конец октября, декабря, марта, июня — последние 10 дней месяца */
const SESSION_M=[2,5,9,11];
function inSession(t){const d=new Date(t),m=d.getUTCMonth();
  if(SESSION_M.indexOf(m)<0)return false;
  const dim=new Date(Date.UTC(d.getUTCFullYear(),m+1,0)).getUTCDate();
  return d.getUTCDate()>=dim-9;}
function weekIsLight(startT,days){for(let i=0;i<days;i++)if(inSession(startT+i*DAY))return true;return false;}

const PTS={media:5,study:10,prod:20,field:15,log:3,rest:2};
const KIND={media:"медиа",study:"учёба",prod:"продукт",field:"поле",log:"лог",rest:"отдых"};
const KCLS={media:"media",prod:"prod",field:"field",study:"",log:"",rest:""};
const CASE12="12 полей: контекст · задача · аудитория · инсайт · идея · механика · визуальный язык · каналы · производство · результат · слабое место · адаптация";
const REFLECT="Что увидела · что поняла · что изменю в работе · какой вопрос остаётся открытым";
const PARTITURA="Партитура опыта: что до входа · как понял правила · первый сигнал · где возникло любопытство · где упала энергия · кульминация · переход · финал · что осталось после";

/* ---------- шаблон дня ---------- */
function tpl(o,light){
  const M=t=>({k:"media",t,m:"media"});
  const S=(t,d,m)=>({k:"study",t,d,m});
  const P=(t,d)=>({k:"prod",t,d,m:"product"});
  const F=(t,d)=>({k:"field",t,d,m:"field"});
  if(light) return [
    [M("Медиапроект — 45 минут")],
    [M("Медиапроект — 45 минут"),S("Чтение, 20 мин",o.mon,"read")],
    [M("Медиапроект — 45 минут"),S("Одна карточка кейса, 30 мин",CASE12,"case")],
    [M("Медиапроект — 45 минут"),P("Главная работа недели",o.thu)],
    [{k:"rest",t:"Полный выходной от всего, кроме вуза",m:"off"},S("Фильм: "+o.film,"Изучать: "+o.filmNote,"film")],
    [F("Поле, 2 ч",o.sat)],
    [S("Короткая рефлексия, 30 мин",REFLECT+". Выбрать режим на следующую неделю","reflect")]
  ];
  return [
    [M("Медиапроект — 1,5 часа"),S("Чтение, 1 ч",o.mon,"read"),{k:"log",t:"Быстрый лог кейса, 5 мин",d:"Три поля: задача · приём · почему сработало",m:"log"}],
    [M("Медиапроект — 1,5 часа"),S("Визуальная работа, 1 ч",o.tue,"visual"),{k:"log",t:"Быстрый лог кейса, 5 мин",d:"Три поля: задача · приём · почему сработало",m:"log"}],
    [M("Медиапроект — 1,5 часа"),S("Глубокая карточка кейса, 1 ч",CASE12,"case"),{k:"log",t:"Быстрый лог кейса, 5 мин",d:"Три поля: задача · приём · почему сработало",m:"log"}],
    [M("Медиапроект — 1,5 часа"),P("Главная работа месяца, 1,5 ч",o.thu)],
    [M("Медиапроект — 1,5 часа"),S("Фильм: "+o.film,"Изучать: "+o.filmNote+". Три строки заметок, не рецензия","film"),{k:"rest",t:"Облегчённый день — больше ничего не планируем",m:"easy"}],
    [F("Поле, 2,5 ч",o.sat+". "+PARTITURA)],
    [M("Медиапроект — 1,5 часа"),S("Систематизация базы, 1 ч",o.sun,"sys"),S("Рефлексия недели",REFLECT,"reflect")]
  ];
}

function mkDays(cw,o,light){
  const st=cwStart(cw),en=cwEnd(cw),T=tpl(o,light),out=[];
  const off=(new Date(st).getUTCDay()+6)%7;      // 0 = понедельник
  for(let t=st;t<=en;t+=DAY){
    const idx=(new Date(t).getUTCDay()+6)%7;
    out.push({t,iso:iso(t),dow:DOW[idx],items:T[idx]});
  }
  return out;
}

/* ---------- сборка модели ---------- */
const MODEL=[];
const CONTENT=D.weeks;         // 26 содержательных недель
const SESS=D.sessions;         // 4 сессионные недели
const SESSION_CW=[11,12,20,21];
const plan=[];                 // [{cw, type:'w'|'s', data}]
let ci=0,si=0;
for(let cw=1;cw<=30;cw++){
  if(SESSION_CW.indexOf(cw)>=0) plan.push({cw,type:"s",data:SESS[si++]});
  else plan.push({cw,type:"w",data:CONTENT[ci++]});
}

D.months16.forEach(m=>{
  const weeks=[];
  for(let cw=m.from;cw<=m.to;cw++){
    const p=plan.find(x=>x.cw===cw),w=p.data;
    const days=mkDays(cw,w,false);
    const light=w.session?true:weekIsLight(cwStart(cw),days.length);
    const d2=mkDays(cw,w,light);
    weeks.push({label:(p.type==="s"?"Сессия":"Неделя "+cw),mode:light?"О":"Б",
      theme:w.theme,result:w.result,range:fmt(cwStart(cw))+" – "+fmt(cwEnd(cw)),
      detail:w.detail,days:d2});
  }
  MODEL.push({key:"m"+m.n,label:m.label,dates:m.dates,theme:m.theme,blurb:m.blurb,
    product:m.product,books:m.books,weeks});
});

D.later.forEach(m=>{
  const first=m.from?Date.parse(m.from+"T00:00:00Z"):Date.UTC(m.year,m.month-1,1);
  const dim=new Date(Date.UTC(m.year,m.month,0)).getUTCDate();
  const last=m.to?Date.parse(m.to+"T00:00:00Z"):Date.UTC(m.year,m.month-1,dim);
  const shift=(new Date(first).getUTCDay()+6)%7;
  let cursor=first-shift*DAY,wi=0;const weeks=[];
  while(cursor<=last){
    const ci2=Math.min(wi,3);
    const o={mon:m.book+" — "+m.parts[ci2],tue:m.tue[ci2],thu:m.thu[ci2],
      film:m.watch[ci2][0],filmNote:m.watch[ci2][1],sat:m.field[ci2],
      sun:"Свести базу кейсов, атлас и заметки месяца"};
    const light=weekIsLight(cursor,7);
    const T=tpl(o,light),all=[];
    for(let i=0;i<7;i++){const t=cursor+i*DAY;
      if(t>=first&&t<=last)all.push({t,iso:iso(t),dow:DOW[i],items:T[i]});}
    if(all.length)weeks.push({label:"Неделя "+(weeks.length+1),mode:light?"О":"Б",
      theme:m.tue[ci2],result:m.thu[ci2],
      range:fmt(all[0].t)+" – "+fmt(all[all.length-1].t),days:all});
    cursor+=7*DAY;wi++;
  }
  MODEL.push({key:"m"+m.n,label:m.title||("Месяц "+m.n),dates:m.dates||(MN[m.month-1]+" "+m.year),
    theme:m.theme,blurb:m.blurb,product:m.product,
    books:"<b>Основная книга:</b> "+m.book+". <b>Фоновое чтение:</b> "+m.bg.join(" · "),
    detail:m.detail,weeks});
});

MODEL.forEach(mo=>mo.weeks.forEach(w=>w.days.forEach(d=>d.items.forEach((it,i)=>{it.id=d.iso+"-"+i;}))));
const IDS={},PTMAP={};
MODEL.forEach(mo=>{IDS[mo.key]=[];mo.weeks.forEach(w=>w.days.forEach(d=>d.items.forEach(it=>{IDS[mo.key].push(it.id);PTMAP[it.id]=PTS[it.k];})));});
const TOTAL=Object.values(IDS).reduce((a,b)=>a+b.length,0);
const MAXPTS=Object.values(PTMAP).reduce((a,b)=>a+b,0);

const LEVELS=[[0,"Наблюдатель"],[.06,"Исследователь"],[.16,"Стратег"],[.32,"Автор идеи"],
  [.5,"Арт-директор"],[.7,"Креативный лид"],[.88,"Креативный директор"]];

/* ---------- хранилище ---------- */
let done=new Set(),saveTimer=null;
const KEY="partitura-v2";
const $=s=>document.querySelector(s);
async function load(){try{const r=await window.storage.get(KEY);
  if(r&&r.value)done=new Set(JSON.parse(r.value));}catch(e){}}
function save(){clearTimeout(saveTimer);$("#savestate").textContent="сохраняю…";
  saveTimer=setTimeout(async()=>{try{await window.storage.set(KEY,JSON.stringify([...done]));
    $("#savestate").textContent="сохранено";
    setTimeout(()=>{$("#savestate").textContent="";},1600);
  }catch(e){$("#savestate").textContent="не сохранилось";}},500);}

/* ---------- отрисовка ---------- */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const pct=k=>{const a=IDS[k];return a&&a.length?Math.round(a.filter(i=>done.has(i)).length/a.length*100):0;};
const points=()=>{let s=0;done.forEach(i=>{s+=PTMAP[i]||0});return s;};

function howHTML(mid){
  const m=D.methods[mid];if(!m)return "";
  return `<details class="hw"><summary>как выполнять</summary><div class="hwb">`+
    `<b>${esc(m.h)}</b>`+
    `<div class="hwl"><span>Порядок</span><ol>${m.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`+
    `<div class="hwl"><span>Вариации исполнения</span><ul>${m.v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`+
    `<div class="hwd">${esc(m.d)}</div></div></details>`;
}
function itemHTML(it){
  return `<div class="itw"><label class="it"><input type="checkbox" data-id="${it.id}"${done.has(it.id)?" checked":""}>`+
    `<span class="itxt"><em class="${KCLS[it.k]}">${KIND[it.k]}</em>${esc(it.t)}`+
    `<i class="pts">+${PTS[it.k]}</i>${it.d?`<small>${esc(it.d)}</small>`:""}</span></label>`+
    howHTML(it.m)+`</div>`;
}
function dayHTML(d,now){
  const dt=new Date(d.t);
  return `<div class="day${now?" now":""}"><div class="dstamp"><b>${d.dow}</b>${dt.getUTCDate()} ${MG[dt.getUTCMonth()].slice(0,3)}</div>`+
    `<div class="items">${d.items.map(itemHTML).join("")}</div></div>`;
}
function detailHTML(d,label){
  if(!d||!d.length)return "";
  return `<details class="dt"><summary>${label}</summary><div class="dtb">`+
    d.map(s=>`<div class="dts"><b>${esc(s.h)}</b>`+
      (s.p?`<p>${esc(s.p)}</p>`:"")+
      (s.l?`<ul>${s.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
      `</div>`).join("")+`</div></details>`;
}
function monthHTML(mo){
  const today=iso(Date.now());
  return mo.weeks.map(w=>`<div class="week"><div class="whead">
    <span class="wnum">${w.label} · ${w.range}</span>
    <span class="wtheme">${esc(w.theme)}</span>
    <span class="wmode ${w.mode==="О"?"o":"b"}">${w.mode==="О"?"ОБЛЕГЧЁННЫЙ":"БАЗОВЫЙ"}</span>
    <span class="wres"><b>Результат недели:</b> ${esc(w.result)}</span></div>
    ${detailHTML(w.detail,"Что разбирается на этой неделе")}
    ${w.days.map(d=>dayHTML(d,d.iso===today)).join("")}</div>`).join("");
}
function renderStage(yid){
  if(yid==="ref"){$("#stage").innerHTML=`<div class="ref">${D.ref}</div>`;return;}
  const y=D.years.find(x=>x.id===yid);
  $("#stage").innerHTML=y.months.map(n=>{
    const mo=MODEL.find(x=>x.key==="m"+n);
    return `<div class="month" data-key="${mo.key}"><button class="mhead" aria-expanded="false">
      <span class="mnum">M${n}</span><span class="mtitle"><b>${esc(mo.theme)}</b>
      <span>${esc(mo.dates)} · ${esc(mo.blurb)}</span></span>
      <span class="mpct">${pct(mo.key)}%</span><span class="chev">▶</span></button>
      <div class="mbody"><div class="mprod"><b>Продукт месяца</b>${esc(mo.product)}</div>
      <div class="mbooks">${mo.books}</div>${detailHTML(mo.detail,"Разбор темы месяца")}
      <div class="wrapbody"></div></div></div>`;
  }).join("");
  $("#stage").querySelectorAll(".mhead").forEach(btn=>btn.addEventListener("click",()=>{
    const box=btn.parentElement,open=box.classList.toggle("open");
    btn.setAttribute("aria-expanded",open);
    const body=box.querySelector(".wrapbody");
    if(open&&!body.dataset.filled){body.innerHTML=monthHTML(MODEL.find(x=>x.key===box.dataset.key));
      body.dataset.filled="1";}
  }));
}
function renderTabs(){
  const list=D.years.concat([{id:"ref",label:"Справочник"}]);
  $("#tabs").innerHTML=list.map((y,i)=>`<button class="tab" role="tab" data-y="${y.id}" aria-selected="${i===0}">${y.label}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    $("#tabs").querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
    t.setAttribute("aria-selected","true");renderStage(t.dataset.y);}));
}
function renderToday(){
  const today=iso(Date.now());let f=null,mo=null,wk=null;
  MODEL.forEach(m=>m.weeks.forEach(w=>w.days.forEach(d=>{if(d.iso===today){f=d;mo=m;wk=w;}})));
  const el=$("#today");
  if(!f){el.innerHTML=`<div class="cap">Программа стартует 12 августа 2026</div>
    <h2>Сегодня вне графика</h2><div class="meta">Открой нужный месяц ниже — все дни на месте.</div>`;return;}
  const dt=new Date(f.t);
  el.innerHTML=`<div class="cap">Сегодня · ${f.dow}, ${dt.getUTCDate()} ${MG[dt.getUTCMonth()]}</div>
    <h2>${esc(wk.theme)}</h2>
    <div class="meta">${mo.label} · ${esc(mo.theme)} — ${wk.label}, режим ${wk.mode==="О"?"облегчённый":"базовый"}</div>
    <div class="items">${f.items.map(itemHTML).join("")}</div>`;
}
function renderLevel(){
  const p=points(),r=p/MAXPTS;let cur=LEVELS[0],nxt=null;
  for(let i=0;i<LEVELS.length;i++){if(r>=LEVELS[i][0])cur=LEVELS[i];else{nxt=LEVELS[i];break;}}
  $("#lvlname").textContent=cur[1];
  $("#lvlpts").textContent=p.toLocaleString("ru")+" из "+MAXPTS.toLocaleString("ru")+" баллов";
  $("#lvlbar").style.width=Math.min(100,r*100)+"%";
  $("#lvlnext").textContent=nxt?"до уровня «"+nxt[1]+"» — "+Math.max(0,Math.ceil(nxt[0]*MAXPTS-p)).toLocaleString("ru")+" баллов":"высший уровень";
  $("#ptscount").textContent=p.toLocaleString("ru");
}
function renderScore(){
  $("#score").innerHTML=MODEL.map(mo=>{const p=pct(mo.key);
    return `<i class="${p===100?"on":p>0?"part":""}" title="${esc(mo.label)} — ${p}%"></i>`}).join("");
  $("#donecount").textContent=done.size;$("#allcount").textContent=TOTAL;
  renderLevel();
}
function refresh(){document.querySelectorAll(".month").forEach(b=>{
  const e=b.querySelector(".mpct");if(e)e.textContent=pct(b.dataset.key)+"%";});renderScore();}

document.addEventListener("change",e=>{
  const cb=e.target;if(!cb.matches('input[type="checkbox"][data-id]'))return;
  const id=cb.dataset.id;
  if(cb.checked)done.add(id);else done.delete(id);
  document.querySelectorAll(`input[data-id="${id}"]`).forEach(x=>{x.checked=cb.checked;});
  refresh();save();
});
$("#reset").addEventListener("click",()=>{
  if(!confirm("Снять все галочки и обнулить баллы? Отменить будет нельзя."))return;
  done=new Set();
  document.querySelectorAll('input[type="checkbox"][data-id]').forEach(x=>{x.checked=false;});
  refresh();save();
});
$("#legend").innerHTML=D.legend;

(async function(){await load();renderTabs();renderStage(D.years[0].id);renderToday();renderScore();})();
</script>
